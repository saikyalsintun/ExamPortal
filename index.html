<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Exam Portal</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js?v=3" defer></script>
</head>
<body>
  <main class="page">
    <section class="portal-card">
      <div class="brand-mark" aria-hidden="true">中</div>
      <p class="eyebrow">CHINESE LEARNING</p>
      <h1>Exam Portal</h1>
      <p class="subtitle">Enter your registered name to open your exam.</p>

      <form id="examForm" autocomplete="off">
        <label for="studentName">Student name</label>
        <input
          id="studentName"
          name="studentName"
          type="text"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >
        <button type="submit">Continue to Exam <span aria-hidden="true">→</span></button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>

      <div class="help-note">
        <span class="lock-icon" aria-hidden="true">✦</span>
        <span>Use the name provided by your teacher. Names are not case-sensitive.</span>
      </div>
    </section>
    <footer>Chinese Exam Portal</footer>
  </main>
</body>
</html>
